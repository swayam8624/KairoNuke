name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-neutral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: swayam8624/KairoPipelineCore
          path: KairoPipelineCore
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        env:
          PYTHONPATH: KairoPipelineCore/src:python
        run: python -m unittest discover -s tests -v
      - name: Compile startup and package modules
        run: python -m compileall -q python init.py menu.py tests
