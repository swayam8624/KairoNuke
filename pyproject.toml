[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-nuke"
version = "0.1.0"
description = "Nuke shot preflight and publish-manifest tools"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Swayam Singal"}]

[tool.setuptools.packages.find]
where = ["python"]
